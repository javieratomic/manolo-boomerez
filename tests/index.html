<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tests · Manolo Boomerez S.L.</title>
  <style>
    body { font: 14px/1.5 ui-monospace, Consolas, monospace; background: #1e1a16; color: #eee; padding: 16px; }
    .ok { color: #8fdc7a; } .ko { color: #ff8a7a; } pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Tests de simulación</h1>
  <pre id="out"></pre>
  <script type="module">
    import { run } from './runner.js';
    import './sim.test.js';
import './expansion.test.js';
import './empire.test.js';
import './synergies.test.js';
import './construction.test.js';
import './local-events.test.js';
import './marketing.test.js';
import './online.test.js';
import './navigation.test.js';
import './operations.test.js';
import './portfolio.test.js';
    import './dom.test.js';
    const out = document.getElementById('out');
    const result = await run((line, ok) => {
      const span = document.createElement('span');
      span.className = ok ? 'ok' : 'ko';
      span.textContent = line + '\n';
      out.appendChild(span);
    });
    window.__testResult = { passed: result.passed, total: result.total, failures: result.failures.map((f) => `${f.name}: ${f.error.message}`) };
  </script>
</body>
</html>
